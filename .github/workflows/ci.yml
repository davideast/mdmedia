name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify Package & Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: bun install

      - name: Verify Type Integrity (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Build Package (dist/)
        run: bun run build

      - name: Run Unit Test Suite (bun test)
        run: bun test

      - name: Run Complete Verification & Packaging Sandbox Harness
        run: bun run verify
